name: Android CI / APK Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle assembleDebug > build_log.txt 2>&1 || {
          echo "================================================================="
          echo "🔥 ASIL HATA BURADA: LÜTFEN SADECE BU KISMIN RESMİNİ ÇEK 🔥"
          echo "================================================================="
          grep -A 15 "What went wrong:" build_log.txt || true
          grep -A 5 "^e: " build_log.txt || true
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

name: Flutter arm64-v8a APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android İskeletini Oluştur
        run: |
          flutter create --platforms=android --org com.romeoakyuz .
          flutter pub get

      - name: V8a APK Derle
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: radyo-arm64-v8a-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
